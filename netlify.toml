# Netlify 构建配置
# 锁死 Node 版本为 20（Netlify 默认用 Node 24 + npm 11，
# 与本项目 lock 文件不兼容，导致 postcss 报 ETARGET）。
# 只锁 Node，不锁 npm —— 让 Netlify 用 Node 20 自带的 npm 10。

[build]
  command = "npx next build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

[context.production.environment]
  NODE_VERSION = "20"