<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>离线了 · 学习资料库</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f8fafc;
      font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      color: #1e293b;
      text-align: center;
      padding: 24px;
    }
    .box { max-width: 320px; }
    .icon { font-size: 48px; margin-bottom: 12px; }
    h1 { font-size: 18px; margin: 0 0 8px; }
    p { font-size: 14px; color: #64748b; line-height: 1.7; margin: 0 0 20px; }
    button {
      background: #2563eb;
      color: #fff;
      border: 0;
      border-radius: 10px;
      padding: 12px 28px;
      font-size: 15px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="box">
    <div class="icon">📡</div>
    <h1>当前网络不可用</h1>
    <p>请检查网络连接后重试。资料和DDL 需要联网才能同步。</p>
    <button onclick="location.reload()">重新加载</button>
  </div>
</body>
</html>
